version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - NODE_ENV=${NODE_ENV:-development}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - APP_TITLE=${APP_TITLE:-CrewAI Visualizer API}
      - APP_DESCRIPTION=${APP_DESCRIPTION:-API for CrewAI Visualizer}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - CORS_CREDENTIALS=${CORS_CREDENTIALS:-True}
      - CORS_METHODS=${CORS_METHODS:-*}
      - CORS_HEADERS=${CORS_HEADERS:-*}
      - API_WELCOME_MESSAGE=${API_WELCOME_MESSAGE:-Welcome to CrewAI Visualizer API}
    volumes:
      - ./backend:/app
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app worker --loglevel=${CELERY_LOG_LEVEL:-info}
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CELERY_TASK_SERIALIZER=${CELERY_TASK_SERIALIZER:-json}
      - CELERY_ACCEPT_CONTENT=${CELERY_ACCEPT_CONTENT:-json}
      - CELERY_RESULT_SERIALIZER=${CELERY_RESULT_SERIALIZER:-json}
      - CELERY_TIMEZONE=${CELERY_TIMEZONE:-UTC}
      - CELERY_ENABLE_UTC=${CELERY_ENABLE_UTC:-True}
      - CELERY_TASK_TIME_LIMIT=${CELERY_TASK_TIME_LIMIT:-3600}
      - CELERY_WORKER_PREFETCH_MULTIPLIER=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
    volumes:
      - ./backend:/app
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - backend

  redis:
    image: redis:${REDIS_VERSION:-alpine}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - app-network
    command: redis-server --appendonly ${REDIS_APPENDONLY:-yes}

networks:
  app-network:
    driver: bridge
